 scene.background = new THREE.Color(0x0A1F3D);

  // ======================================================================
  // Procedural studio envmap — what the chrome reflects
  // ======================================================================
  function buildEnvMap() {
    const envScene = new THREE.Scene();

    const gradCanvas = document.createElement('canvas');
    gradCanvas.width  = 4;
    gradCanvas.height = 1024;
    const gctx = gradCanvas.getContext('2d');
    const grad = gctx.createLinearGradient(0, 0, 0, 1024);
    grad.addColorStop(0.00, '#F4F0E8');
    grad.addColorStop(0.18, '#A89A88');
    grad.addColorStop(0.40, '#34384A');
    grad.addColorStop(0.55, '#1A2238');
    grad.addColorStop(0.78, '#080F1E');
    grad.addColorStop(1.00, '#02050C');
    gctx.fillStyle = grad;
    gctx.fillRect(0, 0, gradCanvas.width, gradCanvas.height);
    const gradTex = new THREE.CanvasTexture(gradCanvas);
    gradTex.mapping = THREE.EquirectangularReflectionMapping;
    gradTex.colorSpace = THREE.SRGBColorSpace;
    envScene.background = gradTex;

    const ceiling = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 220),
      new THREE.MeshBasicMaterial({ color: 0xFFFAF0 })
    );
    ceiling.position.set(0, 300, -40);
    ceiling.rotation.x = Math.PI / 2;
    envScene.add(ceiling);

    const keyBar = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 360),
      new THREE.MeshBasicMaterial({ color: 0xFFFFFF })
    );
    keyBar.position.set(220, 50, -180);
    envScene.add(keyBar);

    const warmRim = new THREE.Mesh(
      new THREE.PlaneGeometry(180, 320),
      new THREE.MeshBasicMaterial({ color: 0xE8B098 })
    );
    warmRim.position.set(-260, -30, 60);
    warmRim.rotation.y = Math.PI / 2;
    envScene.add(warmRim);

    const coolBack = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 200),
      new THREE.MeshBasicMaterial({ color: 0x4A6890 })
    );
    coolBack.position.set(-40, 30, 320);
    coolBack.rotation.y = Math.PI;
    envScene.add(coolBack);

    const floorCard = new THREE.Mesh(
      new THREE.PlaneGeometry(500, 500),
      new THREE.MeshBasicMaterial({ color: 0x2A1A1A })
    );
    floorCard.position.set(0, -260, 0);
    floorCard.rotation.x = -Math.PI / 2;
    envScene.add(floorCard);

    const N_BARS = 8;
    const BAR_RADIUS = 300;
    const barColors = [0xFFFFFF, 0xFFE8C8, 0xC8DCFF, 0xFFFAF0, 0xFFFFFF, 0xFFD8B8, 0xD8E8FF, 0xFFF8E8];
    const barWidths = [18, 10, 22, 12, 16, 8, 24, 14];
    for (let i = 0; i < N_BARS; i++) {
      const angle = (i / N_BARS) * Math.PI * 2 + 0.15;
      const bar = new THREE.Mesh(
        new THREE.PlaneGeometry(barWidths[i], 420),
        new THREE.MeshBasicMaterial({ color: barColors[i] })
      );
      bar.position.set(Math.cos(angle) * BAR_RADIUS, 30, Math.sin(angle) * BAR_RADIUS);
      bar.lookAt(0, 30, 0);
      envScene.add(bar);
    }

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envmap = pmrem.fromScene(envScene, 0.035).texture;
    pmrem.dispose();
    gradTex.dispose();
    return envmap;
  }
  scene.environment = buildEnvMap();

  // ======================================================================

  function buildZShape() {
    const svgString =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + SVG_W + ' ' + SVG_H + '">' +
      '<path d="' + ZURVAN_SVG_PATH + '"/></svg>';
    const data = new SVGLoader().parse(svgString);
    return SVGLoader.createShapes(data.paths[0])[0];
  }

  const extrudeSettings = {
    depth: Z_DEPTH / Z_SCALE,
    bevelEnabled: true,
    bevelSize: 1.5 / Z_SCALE,
    bevelThickness: 1.3 / Z_SCALE,
    bevelSegments: 5,
    curveSegments: 16,
  };

  const chromeMat = new THREE.MeshPhysicalMaterial({
    color: 0xF1F3F8,
    metalness: 1.0,
    roughness: 0.05,
    envMapIntensity: 2.4,
    clearcoat: 0.85,
    clearcoatRoughness: 0.05,
    reflectivity: 1.0,
  });

  const zGeo = new THREE.ExtrudeGeometry(buildZShape(), extrudeSettings);
  zGeo.translate(-SVG_CX, -SVG_CY, 0);
  zGeo.scale(Z_SCALE, -Z_SCALE, Z_SCALE);
  zGeo.translate(0, 0, -Z_DEPTH * 0.5);
  const zMesh = new THREE.Mesh(zGeo, chromeMat);

  // zGroup is the flip parent — rotates 180° around X each cycle. Sand is
  // also a child of this group so it follows the Z's orientation.
  const zGroup = new THREE.Group();
  zGroup.add(zMesh);
  scene.add(zGroup);

  // Brand chrome-Z from the inlined GLTF. Same chrome material as the SVG
  // fallback, just a more refined brand silhouette. Loaded async — the SVG
  // zMesh stays visible for the brief moment before this parses, then we
  // swap visibility.
  {
    const node = document.getElementById('zurvan-z-logo-gltf-json');
    if (node) {
      try {
        new GLTFLoader().parse(node.textContent, '', (gltf) => {
          const model = gltf.scene;
          model.updateMatrixWorld(true);

          // Counter the GLTF's baked +45° Y rotation so the Z faces flat-on.
          model.rotation.y = -Math.PI / 4;
          model.updateMatrixWorld(true);

          // Normalize size to the same Z_TARGET_H as the SVG Z, centered.
          const bbox = new THREE.Box3().setFromObject(model);
          const size = new THREE.Vector3(); bbox.getSize(size);
          const center = new THREE.Vector3(); bbox.getCenter(center);
          const s = Z_TARGET_H / size.y;
          model.scale.setScalar(s);
          model.position.set(-center.x * s, -center.y * s, -center.z * s);

          // Apply our chromeMat to every mesh in the model.
          model.traverse((child) => {
            if (child.isMesh) child.material = chromeMat;
          });

          // GLTF is live — hide the SVG fallback. Add the model into the
          // SAME flip parent (zGroup) so it rotates with each cycle.
          zMesh.visible = false;
          zGroup.add(model);
        }, (err) => console.error('Brand-Z GLTF parse failed', err));
      } catch (e) {
        console.error('Brand-Z GLTF inline parse threw', e);
      }
    }
  }

  // ======================================================================
  // Rose-gold sand — stratified triangle sampling per chamber
  // ======================================================================
  function sampleTriangleDense(verts, count, zRange, zOffset) {
    const a = verts[0], b = verts[1], c = verts[2];
    const zOff = zOffset || 0;
    const cx = (a.x + b.x + c.x) / 3;
    const cy = (a.y + b.y + c.y) / 3;
    const out = new Array(count);
    let idx = 0;

    const interiorCount = Math.floor(count * 0.70);
    const edgeCount     = Math.floor(count * 0.22);
    const cornerCount   = count - interiorCount - edgeCount;

    const n = Math.max(1, Math.ceil(Math.sqrt(interiorCount)));
    for (let i = 0; i < n && idx < interiorCount; i++) {
      for (let j = 0; j < n && idx < interiorCount; j++) {
        const u = (i + Math.random()) / n;
        const v = (j + Math.random()) / n;
        const su = Math.sqrt(u);
        const r1 = 1 - su, r2 = su * (1 - v), r3 = su * v;
        out[idx++] = new THREE.Vector3(
          r1 * a.x + r2 * b.x + r3 * c.x,
          r1 * a.y + r2 * b.y + r3 * c.y,
          zOff + (Math.random() - 0.5) * 2 * zRange
        );
      }
    }
    while (idx < interiorCount) {
      const u = Math.random(), v = Math.random();
      const su = Math.sqrt(u);
      const r1 = 1 - su, r2 = su * (1 - v), r3 = su * v;
      out[idx++] = new THREE.Vector3(
        r1 * a.x + r2 * b.x + r3 * c.x,
        r1 * a.y + r2 * b.y + r3 * c.y,
        zOff + (Math.random() - 0.5) * 2 * zRange
      );
    }

    const tri = [a, b, c];
    for (let i = 0; i < edgeCount; i++) {
      const e = i % 3;
      const va = tri[e], vb = tri[(e + 1) % 3];
      const t = Math.random();
      let px = va.x + (vb.x - va.x) * t;
      let py = va.y + (vb.y - va.y) * t;
      const ex = vb.x - va.x, ey = vb.y - va.y;
      const elen = Math.sqrt(ex * ex + ey * ey) || 1;
      let nx = -ey / elen, ny = ex / elen;
      if ((cx - px) * nx + (cy - py) * ny < 0) { nx = -nx; ny = -ny; }
      const offset = Math.random() * 4.5;
      out[idx++] = new THREE.Vector3(
        px + nx * offset,
        py + ny * offset,
        zOff + (Math.random() - 0.5) * 2 * zRange
      );
    }

    for (let i = 0; i < cornerCount; i++) {
      const v = tri[i % 3];
      const dx = cx - v.x, dy = cy - v.y;
      const dlen = Math.sqrt(dx * dx + dy * dy) || 1;
      const inward = 2 + Math.random() * 7;
      const px = v.x + (dx / dlen) * inward;
      const py = v.y + (dy / dlen) * inward;
      const r = Math.random() * 2.5;
      const th = Math.random() * Math.PI * 2;
      out[idx++] = new THREE.Vector3(
        px + r * Math.cos(th),
        py + r * Math.sin(th),
        zOff + (Math.random() - 0.5) * 2 * zRange
      );
    }

    return out;
  }

  const topPos = sampleTriangleDense(Z_TOP_HOLE, PARTICLE_COUNT_GOLD, SAND_Z_JITTER, SAND_Z_OFFSET);
  const botPos = sampleTriangleDense(Z_BOT_HOLE, PARTICLE_COUNT_GOLD, SAND_Z_JITTER, SAND_Z_OFFSET);
  // topPos sorted DESCENDING by y so HIGH-y particles (top of chamber) leave
  // FIRST. The remaining mass occupies the LOWER portion of the chamber, with
  // empty space above — surface visibly drops as the cycle progresses.
  topPos.sort((a, b) => b.y - a.y);
  // botPos sorted by a center-biased rank so particles fill from
  // center-bottom outward. The pile grows from the neck-drop-point outward
  // and upward like accumulated sand, instead of layered uniformly.
  botPos.sort((a, b) => (a.y + Math.abs(a.x) * 0.3) - (b.y + Math.abs(b.x) * 0.3));

  const pourDelays = new Array(PARTICLE_COUNT_GOLD);
  const fallSpan = 1 - FALL_DURATION;
  for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) pourDelays[i] = (i / (PARTICLE_COUNT_GOLD - 1)) * fallSpan;

  const goldSizes = new Float32Array(PARTICLE_COUNT_GOLD);
  for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) goldSizes[i] = 0.95 + Math.random() * 0.35;

  const goldRot = new Float32Array(PARTICLE_COUNT_GOLD * 3);
  for (let i = 0; i < PARTICLE_COUNT_GOLD * 3; i++) goldRot[i] = Math.random() * Math.PI * 2;

  const goldWobblePhase = new Float32Array(PARTICLE_COUNT_GOLD);
  for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) goldWobblePhase[i] = Math.random() * Math.PI * 2;

  const goldMat = new THREE.MeshPhysicalMaterial({
    color: 0xD89A8A,
    metalness: 1.0,
    roughness: 0.22,
    envMapIntensity: 1.45,
    clearcoat: 0.35,
    clearcoatRoughness: 0.18,
    reflectivity: 1.0,
  });
  const goldInst = new THREE.InstancedMesh(
    new THREE.IcosahedronGeometry(1.2, 0),
    goldMat,
    PARTICLE_COUNT_GOLD
  );
  goldInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  // Add to zGroup so the sand follows the flip rotation automatically.
  zGroup.add(goldInst);

  const dummy = new THREE.Object3D();
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  // ======================================================================
  // Loop state
  // ======================================================================
  // cycleParity 0 → pour from topPos to botPos (sand in top, falls to bottom)
  // cycleParity 1 → pour from botPos to topPos (after the flip, what was
  //                 bottom is now visually on top, so it pours into what was
  //                 top — which is now visually the bottom)
  let cycleParity = 0;
  const phase = { pour: 0 };
  // Sand fades to invisible during the flip — otherwise it visibly travels
  // bottom→top with the rotation, which reads as "sand rising" instead of
  // "hourglass tipping over". Fades out before the flip, fades in after.
  const sandFade = { v: 1 };

  let clockTime = 0;

  function updateGold() {
    const p = phase.pour;
    const usePour = p > 0;

    const turbTimeA = clockTime * 1.7;
    const turbTimeB = clockTime * 1.35;
    const constrictRange = 14;
    const constrictPull  = 0.92;

    for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) {
      let px, py, pz;
      let inFlight = false;
      let neckFactor = 0;
      let settleAge = -1;

      // Pick source / destination based on cycle parity. Both arrays are in
      // zGroup-local space; the InstancedMesh is a child of zGroup, so the
      // rotation is applied automatically by Three.js.
      const src = cycleParity === 0 ? topPos[i] : botPos[i];
      const dst = cycleParity === 0 ? botPos[i] : topPos[i];

      if (usePour) {
        const pourT = clamp01((p - pourDelays[i]) / FALL_DURATION);
        // Power3 easing — particles linger at top then accelerate near the neck.
        const t = pourT * pourT * pourT;
        const om = 1 - t;
        const omSq = om * om;
        const tSq = t * t;
        const om2t = 2 * om * t;
        px = omSq * src.x + om2t * NECK.x + tSq * dst.x;
        py = omSq * src.y + om2t * NECK.y + tSq * dst.y;
        pz = omSq * src.z + om2t * NECK.z + tSq * dst.z;

        // Neck constriction — pinch the stream toward NECK_RADIUS in x,z.
        const dy = py - NECK.y;
        const dyAbs = dy < 0 ? -dy : dy;
        if (dyAbs < constrictRange) {
          neckFactor = 1 - dyAbs / constrictRange;
          const dx = px - NECK.x;
          const dz = pz - NECK.z;
          const r = Math.sqrt(dx * dx + dz * dz);
          if (r > 1e-4) {
            const targetR = NECK_RADIUS + (r - NECK_RADIUS) * (1 - neckFactor * constrictPull);
            const scale = targetR / r;
            px = NECK.x + dx * scale;
            pz = NECK.z + dz * scale;
          }
        }
        inFlight = pourT > 0 && pourT < 1;
        if (pourT >= 1) settleAge = p - (pourDelays[i] + FALL_DURATION);
      } else {
        // Idle: particles sit in the source (top) chamber waiting for the pour.
        px = src.x; py = src.y; pz = src.z;
      }

      // Subtle turbulence while in flight — damped near the neck.
      if (inFlight) {
        const ph = goldWobblePhase[i];
        const damp = 1 - neckFactor * 0.85;
        px += Math.sin(turbTimeA + ph) * TURB_AMP * damp;
        pz += Math.cos(turbTimeB + ph * 1.3) * TURB_AMP * damp;
      }

      // Brief settling oscillation when a particle has just landed.
      if (settleAge >= 0 && settleAge < 0.15) {
        const decay = 1 - settleAge / 0.15;
        const amp = 0.6 * decay;
        const ph = goldWobblePhase[i];
        px += Math.sin(clockTime * 22 + ph * 2.1) * amp;
        py += Math.cos(clockTime * 18 + ph * 2.7) * amp * 0.35;
        pz += Math.sin(clockTime * 25 + ph * 1.5) * amp;
      }

      const r3 = i * 3;
      dummy.rotation.set(goldRot[r3], goldRot[r3 + 1], goldRot[r3 + 2]);
      dummy.position.set(px, py, pz);
      // sandFade.v scales every particle uniformly — set to 0 during the
      // flip so the transit is invisible, then back to 1 after.
      dummy.scale.setScalar(goldSizes[i] * sandFade.v);
      dummy.updateMatrix();
      goldInst.setMatrixAt(i, dummy.matrix);
    }
    goldInst.instanceMatrix.needsUpdate = true;
  }

  // ======================================================================
  // Postprocessing
  // ======================================================================
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(cssW, cssH);
  composer.addPass(new RenderPass(scene, camera));
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(cssW, cssH),
    0.65,
    0.55,
    0.70
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  // ======================================================================
  // Render loop
  // ======================================================================
  function render() {
    clockTime = performance.now() * 0.001;
    updateGold();
    composer.render();
  }
  gsap.ticker.add(render);

  // ======================================================================
  // Loading-icon timeline — pour, flip, swap chambers, repeat forever.
  // ======================================================================
  // Build each cycle as a fresh timeline and chain the next via .call() at
  // the end. This avoids GSAP's timeline-repeat quirk where relative
  // tweens (like the flip's '-=' + Math.PI) get rewound to their recorded
  // start on each repeat — which made the rotation snap back to 0 every
  // even cycle, leaving src=botPos pouring from world-bottom upward.
  function startCycle() {
    // The flip target is computed as an ABSOLUTE value at this exact
    // moment — current rotation minus pi. No relative tween, no rewind.
    const flipTargetX = zGroup.rotation.x - Math.PI;

    gsap.timeline()
      .set(phase, { pour: 0 })
      .set(sandFade, { v: 1 })
      .set(goldInst, { visible: true })
      .to(phase, { pour: 1, duration: 3.2, ease: 'none' })          // dense pour
      .to({},    { duration: 0.25 })                                  // brief settle on bottom
      .to(sandFade, { v: 0, duration: 0.15, ease: 'power2.in' })     // fade sand out at bottom
      .set(goldInst, { visible: false })                              // hard-hide so bloom can't catch travelling particles during the flip
      .to(zGroup.rotation, {                                          // flip 180° to the absolute target
        x: flipTargetX,
        duration: 0.4,
        ease: 'power2.inOut',
        onComplete() {
          cycleParity = 1 - cycleParity;   // chambers swap roles for next cycle
          phase.pour = 0;                  // reset pour — sand will start at new top
        }
      })
      .set(goldInst, { visible: true })                               // re-show now that particles are at the new top
      .to(sandFade, { v: 1, duration: 0.15, ease: 'power2.out' })    // fade sand in at the new top
      .to({},    { duration: 0.1 })                                   // tiny settle before next pour
      .call(startCycle);                                              // chain the next cycle as a fresh timeline
  }
  startCycle();

  // ======================================================================
  // Responsive: keep the renderer matched to the canvas CSS box.
  // ======================================================================
  function onResize() {
    const w = canvas.clientWidth  || 400;
    const h = canvas.clientHeight || 400;
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    bloomPass.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  </script>

</body>
</html>
