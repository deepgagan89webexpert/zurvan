<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZURVAN — 3D Scroll Animation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0A1F3D;
      color: #F3E9D9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .hero {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .hero__canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .after {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 4vw, 56px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .after        { background: #0A1F3D; color: #F3E9D9; }
    .after--dark  { background: #050F1E; color: #C68F8F; }
    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(243, 233, 217, 0.6);
      pointer-events: none;
      z-index: 1;
    }
    .scroll-hint::after {
      content: "";
      display: block;
      width: 1px;
      height: 36px;
      margin: 8px auto 0;
      background: currentColor;
      animation: hint 1.6s ease-in-out infinite;
      transform-origin: top;
    }
    @keyframes hint {
      0%, 100% { transform: scaleY(0.3); opacity: 0.2; }
      50%      { transform: scaleY(1);   opacity: 0.8; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <canvas class="hero__canvas" aria-hidden="true"></canvas>
    <span class="scroll-hint">Scroll</span>
  </section>

  <section class="after">Keep scrolling</section>
  <section class="after after--dark">End</section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';
  import { SVGLoader }      from 'three/addons/loaders/SVGLoader.js';

  gsap.registerPlugin(ScrollTrigger);

  const PARTICLE_COUNT_GOLD   = 8000;    // denser packed sand mass — fills the wider/taller chambers edge-to-edge
  const NECK_RADIUS           = 3;       // tighter stream at the pinch
  const TURB_AMP              = 0.55;

  // Zurvan Z geometry — using the actual brand SVG logo path.
  // SVG viewBox is 102.29 × 116.67, so the natural aspect is ≈0.877.
  // We target Z_HALF_H * 2 = 140 world units of height and let the width
  // follow from the SVG's aspect ratio for exact proportion fidelity.
  const Z_TARGET_H = 140;
  const SVG_W = 102.29;
  const SVG_H = 116.67;
  const Z_SCALE  = Z_TARGET_H / SVG_H;       // ≈ 1.20
  const Z_HALF_H = Z_TARGET_H * 0.5;          // 70
  const Z_HALF_W = (SVG_W * Z_SCALE) * 0.5;   // ≈ 61.4
  const Z_DEPTH    = 28;
  const Z_SLIDE_X  = -160;
  const SVG_CX     = SVG_W * 0.5;             // 51.145 (SVG origin shift for centering)
  const SVG_CY     = SVG_H * 0.5;             // 58.335

  // The official Zurvan Z SVG path (from logo.svg). One continuous closed path:
  // two parallel diagonals form the Z stroke, two horizontal caps form the top
  // and bottom edges, and a calligraphic cubic-bezier swoosh carves into the
  // upper-right of the top portion (mirrored at the bottom-left).
  const ZURVAN_SVG_PATH = 'M0,116.67,83.93,4.44l-4.85,0c-13.66.06-27.32-.1-41,.36C27.48,5.19,24.94,9.48,29.51,19,33.09,26.51,37.34,33.67,41.3,41L40,42,6.25,0h96L20.48,108.27c1,.9,1.23,1.3,1.47,1.29,15.3,0,30.61.22,45.89-.27,6-.19,8.45-4.46,6.37-10.28-2.29-6.4-5.37-12.52-8.17-18.73-1.13-2.49-2.44-4.9-3.67-7.34l1.19-.73,33.74,44.46Z';

  const FALL_DURATION = 0.25;
  // Sand pours VERTICALLY through the center of the Z. The neck sits at
  // x=0, y=0 (between the two chambers) and at z just in front of the Z
  // body's front face so the chrome doesn't occlude the pour stream.
  const NECK = new THREE.Vector3(0, 0, 20);

  // === The hourglass chambers ===
  // Wide hourglass-bulb triangles that span the FULL width of the Z's
  // visible inverted-triangle bulbs (top and bottom) and taper to a point
  // at the central neck. Previously these were only half-width, leaving
  // the left and right slanted shoulders of each bulb empty. Now the
  // chamber covers the entire visible bulb area edge-to-edge.
  // (Particles sit at z just in front of the Z's front face so the chrome
  // body doesn't occlude sand that overlaps the silhouette in x,y.)
  const Z_TOP_HOLE = [   // top chamber — pulled further in so sand stays inside chrome edges
    { x: -35, y:  59 },
    { x:  40, y:  60 },
    { x:   -3, y:   8 },
  ];
  const Z_BOT_HOLE = [   // bottom chamber — mirror
    { x: -35, y: -56 },
    { x:  35, y: -56 },
    { x:   4, y:  -8 },
  ];

  const hero   = document.querySelector('.hero');
  const canvas = document.querySelector('.hero__canvas');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x091F34);
  scene.fog = new THREE.Fog(0x091F34, 700, 1500);

  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 1, 2000);
  camera.position.set(0, 0, 620);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.HemisphereLight(0x8FA8C8, 0x1A2030, 0.35));
  const keyLight = new THREE.DirectionalLight(0xFFF6E8, 1.1);
  keyLight.position.set(110, 160, 220);
  scene.add(keyLight);
  const warmFill = new THREE.DirectionalLight(0xE8A98E, 0.55);
  warmFill.position.set(-130, -50, 160);
  scene.add(warmFill);
  const rimLight = new THREE.DirectionalLight(0xB7C8E8, 0.45);
  rimLight.position.set(-80, 60, -200);
  scene.add(rimLight);
  // Side rakers — put direct light on the extrusion's left + right faces so they don't
  // go dark when the Z rotates and presents its side walls to camera.
  const sideR = new THREE.DirectionalLight(0xFFF1E0, 0.7);
  sideR.position.set(420, 40, 60);
  scene.add(sideR);
  const sideL = new THREE.DirectionalLight(0xE0E8FF, 0.6);
  sideL.position.set(-420, 40, 60);
  scene.add(sideL);

  function buildEnvMap() {
    const envScene = new THREE.Scene();

    // Dark studio gradient: bright neutral top (key bounce), warm middle, deep navy floor.
    // This is what chrome will reflect in its low-roughness range — designed like a
    // luxury photo-studio softbox setup viewed from inside a sphere.
    const gradCanvas = document.createElement('canvas');
    gradCanvas.width  = 4;
    gradCanvas.height = 1024;
    const gctx = gradCanvas.getContext('2d');
    const grad = gctx.createLinearGradient(0, 0, 0, 1024);
    grad.addColorStop(0.00, '#F4F0E8');  // overhead key bounce (warm white)
    grad.addColorStop(0.18, '#A89A88');  // upper midtone
    grad.addColorStop(0.40, '#34384A');  // shadow band
    grad.addColorStop(0.55, '#1A2238');  // horizon
    grad.addColorStop(0.78, '#080F1E');  // lower
    grad.addColorStop(1.00, '#02050C');  // floor / void
    gctx.fillStyle = grad;
    gctx.fillRect(0, 0, gradCanvas.width, gradCanvas.height);
    const gradTex = new THREE.CanvasTexture(gradCanvas);
    gradTex.mapping = THREE.EquirectangularReflectionMapping;
    gradTex.colorSpace = THREE.SRGBColorSpace;
    envScene.background = gradTex;

    // Large overhead softbox — primary highlight that streaks across chrome
    const ceiling = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 220),
      new THREE.MeshBasicMaterial({ color: 0xFFFAF0 })
    );
    ceiling.position.set(0, 300, -40);
    ceiling.rotation.x = Math.PI / 2;
    envScene.add(ceiling);

    // Hard key bar — narrow vertical bright slab that gives chrome a crisp specular streak
    const keyBar = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 360),
      new THREE.MeshBasicMaterial({ color: 0xFFFFFF })
    );
    keyBar.position.set(220, 50, -180);
    envScene.add(keyBar);

    // Warm rim — rose-gold pickup, also gives chrome a warm edge highlight
    const warmRim = new THREE.Mesh(
      new THREE.PlaneGeometry(180, 320),
      new THREE.MeshBasicMaterial({ color: 0xE8B098 })
    );
    warmRim.position.set(-260, -30, 60);
    warmRim.rotation.y = Math.PI / 2;
    envScene.add(warmRim);

    // Cool back fill — adds the navy/blue reflection on the back-facing chrome
    const coolBack = new THREE.Mesh(
      new THREE.PlaneGeometry(400, 200),
      new THREE.MeshBasicMaterial({ color: 0x4A6890 })
    );
    coolBack.position.set(-40, 30, 320);
    coolBack.rotation.y = Math.PI;
    envScene.add(coolBack);

    // Floor card — soft warm bounce from below for that "presented on velvet" feel
    const floorCard = new THREE.Mesh(
      new THREE.PlaneGeometry(500, 500),
      new THREE.MeshBasicMaterial({ color: 0x2A1A1A })
    );
    floorCard.position.set(0, -260, 0);
    floorCard.rotation.x = -Math.PI / 2;
    envScene.add(floorCard);

    // Ring of narrow vertical bars distributed around the central axis. Every rotation
    // angle of the Z catches at least one sharp specular streak — fixes the "looks flat
    // when turned sideways" problem. Bars are tinted alternating warm/cool so the chrome
    // picks up different highlight colors as it spins.
    const N_BARS = 8;
    const BAR_RADIUS = 300;
    const barColors = [0xFFFFFF, 0xFFE8C8, 0xC8DCFF, 0xFFFAF0, 0xFFFFFF, 0xFFD8B8, 0xD8E8FF, 0xFFF8E8];
    const barWidths = [18, 10, 22, 12, 16, 8, 24, 14];
    for (let i = 0; i < N_BARS; i++) {
      const angle = (i / N_BARS) * Math.PI * 2 + 0.15;
      const bar = new THREE.Mesh(
        new THREE.PlaneGeometry(barWidths[i], 420),
        new THREE.MeshBasicMaterial({ color: barColors[i] })
      );
      bar.position.set(Math.cos(angle) * BAR_RADIUS, 30, Math.sin(angle) * BAR_RADIUS);
      bar.lookAt(0, 30, 0);
      envScene.add(bar);
    }

    const pmrem = new THREE.PMREMGenerator(renderer);
    const envmap = pmrem.fromScene(envScene, 0.035).texture;
    pmrem.dispose();
    gradTex.dispose();
    return envmap;
  }
  const envmap = buildEnvMap();
  scene.environment = envmap;

  function makeShape(verts, holes) {
    const s = new THREE.Shape();
    s.moveTo(verts[0].x, verts[0].y);
    for (let i = 1; i < verts.length; i++) s.lineTo(verts[i].x, verts[i].y);
    s.closePath();
    if (holes) {
      for (const h of holes) {
        const hole = new THREE.Path();
        hole.moveTo(h[0].x, h[0].y);
        for (let i = 1; i < h.length; i++) hole.lineTo(h[i].x, h[i].y);
        hole.closePath();
        s.holes.push(hole);
      }
    }
    return s;
  }

  // Build the Zurvan Z silhouette from the brand SVG logo path.
  // SVGLoader.parse() consumes the SVG string and produces ShapePath objects;
  // createShapes() converts each path into THREE.Shape instances ready for
  // ExtrudeGeometry. The returned shape is in SVG coordinate space (y down,
  // origin at top-left of viewBox) — the calling geometry code centers it,
  // flips Y, and scales it to world coordinates.
  function buildZShape() {
    const svgString =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + SVG_W + ' ' + SVG_H + '">' +
      '<path d="' + ZURVAN_SVG_PATH + '"/></svg>';
    const data = new SVGLoader().parse(svgString);
    return SVGLoader.createShapes(data.paths[0])[0];
  }

  const extrudeSettings = {
    depth: Z_DEPTH / Z_SCALE,    // depth is in shape units; scale up to Z_DEPTH world units after geo.scale()
    bevelEnabled: true,
    bevelSize: 1.5 / Z_SCALE,    // ~1.5 world units after scaling
    bevelThickness: 1.3 / Z_SCALE,
    bevelSegments: 5,
    curveSegments: 16,
  };

  const chromeMat = new THREE.MeshPhysicalMaterial({
    color: 0xF1F3F8,
    metalness: 1.0,
    roughness: 0.05,
    envMapIntensity: 2.4,
    clearcoat: 0.85,
    clearcoatRoughness: 0.05,
    reflectivity: 1.0,
  });

  // Solid Zurvan Z mesh built directly from the brand SVG logo path.
  // Pipeline:
  //   1. Extrude the SVG shape (depth is in SVG units, will be scaled up).
  //   2. Translate so the SVG's center (51.145, 58.335) becomes the origin.
  //   3. Scale by Z_SCALE on X and Z, and -Z_SCALE on Y (flips SVG y-down
  //      to Three.js y-up while applying the uniform scale).
  //   4. Re-center the depth on z = 0 (the extrusion goes from 0 to depth,
  //      so we shift by -Z_DEPTH/2). Note that after the y-flip-scale, the
  //      depth direction itself is fine because we scaled z by +Z_SCALE.
  // Result: a perfectly proportioned chrome Z centered at the world origin.
  const zGeo = new THREE.ExtrudeGeometry(buildZShape(), extrudeSettings);
  zGeo.translate(-SVG_CX, -SVG_CY, 0);
  zGeo.scale(Z_SCALE, -Z_SCALE, Z_SCALE);
  zGeo.translate(0, 0, -Z_DEPTH * 0.5);
  const zMesh = new THREE.Mesh(zGeo, chromeMat);

  const zGroup = new THREE.Group();
  zGroup.add(zMesh);
  scene.add(zGroup);

  function bboxOf(verts) {
    let minX =  Infinity, maxX = -Infinity, minY =  Infinity, maxY = -Infinity;
    for (const v of verts) {
      if (v.x < minX) minX = v.x;
      if (v.x > maxX) maxX = v.x;
      if (v.y < minY) minY = v.y;
      if (v.y > maxY) maxY = v.y;
    }
    return { minX, maxX, minY, maxY };
  }
  function pointInPoly(px, py, verts) {
    let inside = false;
    for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
      const xi = verts[i].x, yi = verts[i].y;
      const xj = verts[j].x, yj = verts[j].y;
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  function sampleInterior(verts, count, zRange, yMin, yMax, zOffset) {
    const bb = bboxOf(verts);
    const xMin = bb.minX, xMax = bb.maxX;
    const yLo  = yMin !== undefined ? Math.max(bb.minY, yMin) : bb.minY;
    const yHi  = yMax !== undefined ? Math.min(bb.maxY, yMax) : bb.maxY;
    const zOff = zOffset || 0;
    const out = new Array(count);
    for (let i = 0; i < count; i++) {
      let x, y, tries = 0;
      do {
        x = xMin + Math.random() * (xMax - xMin);
        y = yLo  + Math.random() * (yHi  - yLo);
        if (++tries > 200) break;
      } while (!pointInPoly(x, y, verts));
      out[i] = new THREE.Vector3(x, y, zOff + (Math.random() - 0.5) * 2 * zRange);
    }
    return out;
  }

  function sampleBoundary(verts, count, zRange, zOffset) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < verts.length; i++) {
      const j = (i + 1) % verts.length;
      const dx = verts[j].x - verts[i].x;
      const dy = verts[j].y - verts[i].y;
      const len = Math.hypot(dx, dy);
      segs.push({ ax: verts[i].x, ay: verts[i].y, dx, dy, len });
      total += len;
    }
    const zOff = zOffset || 0;
    const out = new Array(count);
    for (let i = 0; i < count; i++) {
      let t = Math.random() * total;
      for (const seg of segs) {
        if (t <= seg.len) {
          const u = t / seg.len;
          out[i] = new THREE.Vector3(
            seg.ax + seg.dx * u,
            seg.ay + seg.dy * u,
            zOff + (Math.random() - 0.5) * 2 * zRange
          );
          break;
        }
        t -= seg.len;
      }
    }
    return out;
  }

  // Dense triangle sampler for the hourglass chambers.
  //
  // Stratified barycentric coordinates eliminate the random clustering that
  // pure uniform sampling produces — every particle gets its own cell of the
  // triangle with a small in-cell jitter, so the interior fills evenly with
  // no visible gaps. On top of that we add EDGE-biased samples (extra grains
  // hugging each side) and CORNER-biased samples (extra grains tucked into
  // each vertex) so the boundary and apex of the chamber feel fully packed
  // rather than thinning out.
  //
  // Distribution: ~70% stratified interior, ~22% edge, ~8% corner.
  // verts must have exactly 3 vertices.
  function sampleTriangleDense(verts, count, zRange, zOffset) {
    const a = verts[0], b = verts[1], c = verts[2];
    const zOff = zOffset || 0;
    const cx = (a.x + b.x + c.x) / 3;
    const cy = (a.y + b.y + c.y) / 3;
    const out = new Array(count);
    let idx = 0;

    const interiorCount = Math.floor(count * 0.70);
    const edgeCount     = Math.floor(count * 0.22);
    const cornerCount   = count - interiorCount - edgeCount;

    // 1) Stratified barycentric interior — uniform 2D density via the
    //    standard r1 = 1 - sqrt(u), r2 = sqrt(u)*(1-v), r3 = sqrt(u)*v
    //    mapping. Grid resolution n×n where n ≈ sqrt(interiorCount).
    const n = Math.max(1, Math.ceil(Math.sqrt(interiorCount)));
    for (let i = 0; i < n && idx < interiorCount; i++) {
      for (let j = 0; j < n && idx < interiorCount; j++) {
        const u = (i + Math.random()) / n;
        const v = (j + Math.random()) / n;
        const su = Math.sqrt(u);
        const r1 = 1 - su, r2 = su * (1 - v), r3 = su * v;
        out[idx++] = new THREE.Vector3(
          r1 * a.x + r2 * b.x + r3 * c.x,
          r1 * a.y + r2 * b.y + r3 * c.y,
          zOff + (Math.random() - 0.5) * 2 * zRange
        );
      }
    }
    // Fill any remaining slots if interiorCount wasn't a perfect square.
    while (idx < interiorCount) {
      const u = Math.random(), v = Math.random();
      const su = Math.sqrt(u);
      const r1 = 1 - su, r2 = su * (1 - v), r3 = su * v;
      out[idx++] = new THREE.Vector3(
        r1 * a.x + r2 * b.x + r3 * c.x,
        r1 * a.y + r2 * b.y + r3 * c.y,
        zOff + (Math.random() - 0.5) * 2 * zRange
      );
    }

    // 2) Edge-biased — sample along each edge with a small inward
    //    perpendicular offset. Inward direction picked toward the centroid.
    const tri = [a, b, c];
    for (let i = 0; i < edgeCount; i++) {
      const e = i % 3;
      const va = tri[e], vb = tri[(e + 1) % 3];
      const t = Math.random();
      let px = va.x + (vb.x - va.x) * t;
      let py = va.y + (vb.y - va.y) * t;
      const ex = vb.x - va.x, ey = vb.y - va.y;
      const elen = Math.sqrt(ex * ex + ey * ey) || 1;
      let nx = -ey / elen, ny = ex / elen;            // perpendicular candidate
      if ((cx - px) * nx + (cy - py) * ny < 0) { nx = -nx; ny = -ny; }  // flip if pointing outward
      const offset = Math.random() * 4.5;
      out[idx++] = new THREE.Vector3(
        px + nx * offset,
        py + ny * offset,
        zOff + (Math.random() - 0.5) * 2 * zRange
      );
    }

    // 3) Corner-biased — clustered near each vertex, offset inward toward
    //    centroid, with a small radial spread for natural packing.
    for (let i = 0; i < cornerCount; i++) {
      const v = tri[i % 3];
      const dx = cx - v.x, dy = cy - v.y;
      const dlen = Math.sqrt(dx * dx + dy * dy) || 1;
      const inward = 2 + Math.random() * 7;
      const px = v.x + (dx / dlen) * inward;
      const py = v.y + (dy / dlen) * inward;
      const r = Math.random() * 2.5;
      const th = Math.random() * Math.PI * 2;
      out[idx++] = new THREE.Vector3(
        px + r * Math.cos(th),
        py + r * Math.sin(th),
        zOff + (Math.random() - 0.5) * 2 * zRange
      );
    }

    return out;
  }

  function sampleTextPositions(text, count, opts) {
    const fontSize   = opts.fontSize   ?? 220;
    const fontFamily = opts.fontFamily ?? 'Georgia, "Times New Roman", serif';
    const worldWidth = opts.worldWidth ?? 280;
    const offsetX    = opts.offsetX    ?? 0;
    const offsetY    = opts.offsetY    ?? 0;
    const zRange     = opts.zRange     ?? 6;

    const c = document.createElement('canvas');
    c.width  = 1280;
    c.height = 360;
    const cx = c.getContext('2d');
    cx.fillStyle = '#FFFFFF';
    cx.fillRect(0, 0, c.width, c.height);
    cx.fillStyle = '#000000';
    cx.font = `bold ${fontSize}px ${fontFamily}`;
    cx.textBaseline = 'middle';
    cx.textAlign = 'left';
    cx.fillText(text, 30, c.height * 0.5);

    const img = cx.getImageData(0, 0, c.width, c.height).data;
    const dark = [];
    for (let y = 0; y < c.height; y += 2) {
      for (let x = 0; x < c.width; x += 2) {
        if (img[(y * c.width + x) * 4] < 128) dark.push(x, y);
      }
    }
    const out = new Array(count);
    if (dark.length === 0) {
      for (let i = 0; i < count; i++) out[i] = new THREE.Vector3(offsetX, offsetY, 0);
      return out;
    }

    let minX =  Infinity, maxX = -Infinity, minY =  Infinity, maxY = -Infinity;
    for (let k = 0; k < dark.length; k += 2) {
      const x = dark[k], y = dark[k + 1];
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
    const tw = maxX - minX, th = maxY - minY;
    const scale = worldWidth / tw;
    const halfH = th * 0.5;
    const half = dark.length >> 1;

    for (let i = 0; i < count; i++) {
      const k = ((Math.random() * half) | 0) << 1;
      const px = dark[k], py = dark[k + 1];
      const wx = (px - minX) * scale + offsetX;
      const wy = -((py - minY) - halfH) * scale + offsetY;
      const wz = (Math.random() - 0.5) * 2 * zRange;
      out[i] = new THREE.Vector3(wx, wy, wz);
    }
    return out;
  }

  // Sand particles sit in a thin layer just in front of the Z's chrome
  // front face (Z front face ≈ +14 with Z_DEPTH=28). At this depth the
  // sand is fully visible against the Z silhouette even when its x,y
  // overlaps the chrome body — which it does for centered chambers.
  const SAND_Z_OFFSET = 20;
  const SAND_Z_JITTER = 3;

  // Rose-gold sand: densely fills the top chamber on load, pours vertically
  // through the central neck into the bottom chamber. Uses stratified
  // barycentric sampling + edge/corner biasing for a tightly-packed mass
  // with no visible gaps near boundaries or apex.
  const topPos = sampleTriangleDense(Z_TOP_HOLE, PARTICLE_COUNT_GOLD, SAND_Z_JITTER, SAND_Z_OFFSET);
  const botPos = sampleTriangleDense(Z_BOT_HOLE, PARTICLE_COUNT_GOLD, SAND_Z_JITTER, SAND_Z_OFFSET);
  topPos.sort((a, b) => a.y - b.y);
  botPos.sort((a, b) => a.y - b.y);

  // URVAN sits to the right of the Z after the Z slides left.
  // With W=60 and Z_SLIDE_X=-150, the Z spans x ∈ [-210, -90].
  // URVAN starts at x ≈ -85 (small ~5-unit gap) and runs ~300 units right.
  const urvanPos = sampleTextPositions('URVAN', PARTICLE_COUNT_GOLD, {
    fontSize: 280,
    worldWidth: 300,
    offsetX: -85,
    offsetY: 0,
    zRange: 8,
  });

  const scatterDirs = new Array(PARTICLE_COUNT_GOLD);
  for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) {
    const u = Math.random();
    const v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi = Math.acos(2 * v - 1);
    const r = 200 + Math.random() * 140;
    scatterDirs[i] = new THREE.Vector3(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi)
    );
  }

  const pourDelays = new Array(PARTICLE_COUNT_GOLD);
  const fallSpan = 1 - FALL_DURATION;
  for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) pourDelays[i] = (i / (PARTICLE_COUNT_GOLD - 1)) * fallSpan;

  const goldSizes = new Float32Array(PARTICLE_COUNT_GOLD);
  for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) goldSizes[i] = 0.95 + Math.random() * 0.35;

  const goldRot = new Float32Array(PARTICLE_COUNT_GOLD * 3);
  for (let i = 0; i < PARTICLE_COUNT_GOLD * 3; i++) goldRot[i] = Math.random() * Math.PI * 2;

  // Per-particle phase offsets so the wobble pattern looks organic, not uniform
  const goldWobblePhase = new Float32Array(PARTICLE_COUNT_GOLD);
  for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) goldWobblePhase[i] = Math.random() * Math.PI * 2;

  const goldMat = new THREE.MeshPhysicalMaterial({
    color: 0xD89A8A,
    metalness: 1.0,
    roughness: 0.22,
    envMapIntensity: 1.45,
    clearcoat: 0.35,
    clearcoatRoughness: 0.18,
    reflectivity: 1.0,
  });
  const goldInst = new THREE.InstancedMesh(
    new THREE.IcosahedronGeometry(1.2, 0),   // slightly larger grain so neighbours overlap and fill the volume
    goldMat,
    PARTICLE_COUNT_GOLD
  );
  goldInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(goldInst);

  const dummy = new THREE.Object3D();

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  const phase = { pour: 0, scatter: 0, urvan: 0 };

  const tmp = new THREE.Vector3();
  const scatterEnd = new THREE.Vector3();

  function updateGold() {
    const p = phase.pour;
    const s = phase.scatter;
    const u = phase.urvan;
    const useUrvan   = u > 0;
    const useScatter = !useUrvan && s > 0;
    const usePour    = !useUrvan && !useScatter && p > 0;

    const se = s * s;
    const uInv = 1 - u;
    const eu  = 1 - uInv * uInv * uInv;

    const turbTimeA = clockTime * 1.7;
    const turbTimeB = clockTime * 1.35;
    const constrictRange = 14;    // Y distance from neck within which the stream pinches
    const constrictPull  = 0.92;  // 0=no pinch, 1=fully snap to NECK_RADIUS at the neck

    // Mirror the Z's Y rotation onto every sand particle so the sand spins
    // rigidly with the chrome Z (user-drag + idle auto-rotate). Rotate around
    // the Z's current world center (zGroup.position) so the URVAN slide-left
    // doesn't drag the rotation axis with it.
    const rotCos = Math.cos(zMesh.rotation.y);
    const rotSin = Math.sin(zMesh.rotation.y);
    const rotCx  = zGroup.position.x;
    const rotCz  = zGroup.position.z;

    for (let i = 0; i < PARTICLE_COUNT_GOLD; i++) {
      let px, py, pz;
      let inFlight = false;
      let neckFactor = 0;   // 0 far from neck, 1 at neck — used to dampen wobble near pinch
      let settleAge = -1;   // ≥ 0 while a freshly-landed particle is briefly oscillating

      if (useUrvan) {
        const sd = scatterDirs[i];
        const bp = botPos[i];
        const sx = bp.x + sd.x, sy = bp.y + sd.y, sz = bp.z + sd.z;
        const target = urvanPos[i];
        px = sx + (target.x - sx) * eu;
        py = sy + (target.y - sy) * eu;
        pz = sz + (target.z - sz) * eu;
      } else if (useScatter) {
        const sd = scatterDirs[i];
        const bp = botPos[i];
        px = bp.x + sd.x * se;
        py = bp.y + sd.y * se;
        pz = bp.z + sd.z * se;
      } else if (usePour) {
        const pourT = clamp01((p - pourDelays[i]) / FALL_DURATION);
        // Power3 easing on the Bezier parameter — particles linger at top
        // then accelerate hard near the neck, reading as gravity rather than
        // a uniform glide.
        const t = pourT * pourT * pourT;
        const om = 1 - t;
        const omSq = om * om;
        const tSq = t * t;
        const om2t = 2 * om * t;
        const tp = topPos[i];
        const bp = botPos[i];
        px = omSq * tp.x + om2t * NECK.x + tSq * bp.x;
        py = omSq * tp.y + om2t * NECK.y + tSq * bp.y;
        pz = omSq * tp.z + om2t * NECK.z + tSq * bp.z;

        // Neck constriction — pinch the stream toward a small radius around
        // the NECK position (not the world origin) as Y approaches the neck.
        // Without this the Bezier alone leaves the stream visibly fanned
        // out at the pinch.
        const dy = py - NECK.y;
        const dyAbs = dy < 0 ? -dy : dy;
        if (dyAbs < constrictRange) {
          neckFactor = 1 - dyAbs / constrictRange;
          const dx = px - NECK.x;
          const dz = pz - NECK.z;
          const r = Math.sqrt(dx * dx + dz * dz);
          if (r > 1e-4) {
            const targetR = NECK_RADIUS + (r - NECK_RADIUS) * (1 - neckFactor * constrictPull);
            const scale = targetR / r;
            px = NECK.x + dx * scale;
            pz = NECK.z + dz * scale;
          }
        }
        inFlight = pourT > 0 && pourT < 1;
        // When the particle has just landed, briefly oscillate around its
        // resting position for a "sand settling" effect.
        if (pourT >= 1) settleAge = p - (pourDelays[i] + FALL_DURATION);
      } else {
        const tp = topPos[i];
        px = tp.x; py = tp.y; pz = tp.z;
      }

      // Subtle turbulence — only while in-flight during pour. Damped near
      // the neck so the stream stays a clean tight line at the pinch.
      if (inFlight) {
        const ph = goldWobblePhase[i];
        const damp = 1 - neckFactor * 0.85;
        px += Math.sin(turbTimeA + ph) * TURB_AMP * damp;
        pz += Math.cos(turbTimeB + ph * 1.3) * TURB_AMP * damp;
      }

      // Brief settling oscillation when a particle has just landed in the
      // bottom chamber. High-frequency, low amplitude, decaying to zero
      // over the first ~0.15 of pour-phase units since landing.
      if (settleAge >= 0 && settleAge < 0.15) {
        const decay = 1 - settleAge / 0.15;
        const amp = 0.6 * decay;
        const ph = goldWobblePhase[i];
        px += Math.sin(clockTime * 22 + ph * 2.1) * amp;
        py += Math.cos(clockTime * 18 + ph * 2.7) * amp * 0.35;
        pz += Math.sin(clockTime * 25 + ph * 1.5) * amp;
      }

      // Apply the Z's Y rotation around (rotCx, 0, rotCz). When rotation is 0
      // this is a no-op (cos=1, sin=0). Sand spins rigidly with the Z.
      const dpx = px - rotCx;
      const dpz = pz - rotCz;
      px = dpx * rotCos + dpz * rotSin + rotCx;
      pz = -dpx * rotSin + dpz * rotCos + rotCz;

      dummy.position.set(px, py, pz);
      const r3 = i * 3;
      dummy.rotation.set(goldRot[r3], goldRot[r3 + 1], goldRot[r3 + 2]);
      dummy.scale.setScalar(goldSizes[i]);
      dummy.updateMatrix();
      goldInst.setMatrixAt(i, dummy.matrix);
    }
    goldInst.instanceMatrix.needsUpdate = true;
  }

  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(window.innerWidth, window.innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.65,   // strength — bumped for more luxury glow on highlights
    0.55,   // radius
    0.70    // threshold — catches more of the chrome specular streak
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  let clockTime = 0;
  const camLookAt = new THREE.Vector3();

  // Drag + snap-back state shared with the interaction block below.
  let userIsDragging = false;
  let isSnappingBack = false;
  const ROT_EPSILON = 0.01;

  // Snap the Z back to its zero rotation along the shortest arc (so a 5-spin Z
  // doesn't unwind five full turns). Called before scroll proceeds.
  function snapZBackToZero() {
    if (isSnappingBack) return;
    if (Math.abs(zMesh.rotation.y) < ROT_EPSILON) {
      zMesh.rotation.y = 0;
      return;
    }
    let r = zMesh.rotation.y % (Math.PI * 2);
    if (r >  Math.PI) r -= Math.PI * 2;
    if (r < -Math.PI) r += Math.PI * 2;
    zMesh.rotation.y = r;
    isSnappingBack = true;
    gsap.to(zMesh.rotation, {
      y: 0,
      duration: 0.5,
      ease: 'power2.out',
      onComplete: () => {
        isSnappingBack = false;
        canvas.style.touchAction = 'pan-y';
      },
    });
  }

  function render() {
    clockTime = performance.now() * 0.001;

    // Subtle cinematic camera drift — slow sinusoidal offsets, partial-track the Z
    camera.position.x = Math.sin(clockTime * 0.14) * 7;
    camera.position.y = Math.cos(clockTime * 0.11) * 3.5;
    camLookAt.set(zGroup.position.x * 0.3, zGroup.position.y, 0);
    camera.lookAt(camLookAt);

    updateGold();
    composer.render();
  }
  gsap.ticker.add(render);

  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h);
    composer.setSize(w, h);
    bloomPass.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    ScrollTrigger.refresh();
  }
  window.addEventListener('resize', onResize);

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: '.hero',
      start: 'top top',
      end: '+=5800',
      scrub: 0.6,
      pin: true,
      anticipatePin: 1,
    }
  });

  // Cinematic opening hold so the chrome Z + rose-gold-filled top chamber
  // read before anything moves. Then the dense pour through the narrow neck,
  // the settled-bottom beat, scatter, and the URVAN reveal with Z slide.
  tl.to({},    { duration: 1.0 })                                    // opening hold — loaded Z visible
    .to(phase, { pour:    1, duration: 3.2, ease: 'none' })          // dense, narrow, gravity-eased pour
    .to({},    { duration: 0.8 })                                    // bottom chamber fully settled
    .to(phase, { scatter: 1, duration: 1.5, ease: 'power2.in' })
    .to({},    { duration: 0.4 })                                    // dispersed cloud beat
    .to(phase, { urvan:   1, duration: 1.7, ease: 'power3.out' })
    .to(zGroup.position, { x: Z_SLIDE_X, duration: 1.7, ease: 'power3.out' }, '<');

  gsap.to('.scroll-hint', {
    opacity: 0,
    scrollTrigger: { trigger: '.hero', start: 'top top', end: '+=200', scrub: true }
  });

  // === Drag horizontally on the canvas to spin the chrome Z 360° around its Y axis ===
  // Mouse: any horizontal click-drag rotates the Z.
  // Touch: horizontal-vs-vertical detection — horizontal swipes rotate the Z,
  // vertical swipes scroll the page as normal when the Z is at home.
  //
  // Snap-back behavior: once the user has rotated the Z away from zero, their
  // next scroll attempt (wheel OR vertical touch) doesn't scroll — instead it
  // animates the Z back to its home rotation. The scroll that follows after
  // the snap-back completes goes through normally.
  {
    let dragStartX = 0;
    let zRotationStart = 0;
    const DRAG_SENSITIVITY = (Math.PI * 2) / 600;     // ~600px drag = one full rotation
    const TOUCH_DECIDE_PX  = 8;                       // movement needed before we commit to "rotate" vs "scroll"

    canvas.style.cursor = 'grab';
    canvas.style.touchAction = 'pan-y';               // browser handles vertical pan when Z is at home

    // Called whenever the Z's resting rotation changes — locks the canvas to
    // touch-action: none while rotated so vertical-touch scroll can be
    // intercepted cleanly; restores pan-y once the Z is home.
    const refreshTouchAction = () => {
      if (Math.abs(zMesh.rotation.y) > ROT_EPSILON) {
        canvas.style.touchAction = 'none';
      } else {
        canvas.style.touchAction = 'pan-y';
      }
    };

    // ===== MOUSE =====
    canvas.addEventListener('mousedown', (e) => {
      if (isSnappingBack) {
        gsap.killTweensOf(zMesh.rotation);
        isSnappingBack = false;
      }
      userIsDragging = true;
      dragStartX = e.clientX;
      zRotationStart = zMesh.rotation.y;
      canvas.style.cursor = 'grabbing';
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!userIsDragging) return;
      const deltaX = e.clientX - dragStartX;
      zMesh.rotation.y = zRotationStart + deltaX * DRAG_SENSITIVITY;
    });

    const endMouseDrag = () => {
      if (!userIsDragging) return;
      userIsDragging = false;
      canvas.style.cursor = 'grab';
      refreshTouchAction();
    };
    window.addEventListener('mouseup', endMouseDrag);
    window.addEventListener('mouseleave', endMouseDrag);

    // ===== WHEEL (desktop scroll) =====
    // If the Z is rotated, the first wheel event snaps it back to home and
    // does not advance scroll. Subsequent wheels scroll normally.
    window.addEventListener('wheel', (e) => {
      if (userIsDragging) return;
      if (isSnappingBack) { e.preventDefault(); return; }
      if (Math.abs(zMesh.rotation.y) > ROT_EPSILON) {
        e.preventDefault();
        snapZBackToZero();
      }
    }, { passive: false });

    // ===== TOUCH =====
    // Direction detection: hold off committing to a drag until the finger has
    // moved enough pixels to decide horizontal vs vertical intent.
    //   - Horizontal intent → rotate Z, preventDefault to stop page scroll.
    //   - Vertical intent + Z is rotated → snap back, preventDefault this gesture.
    //   - Vertical intent + Z is home → let the browser scroll (pan-y).
    let touchStartX = 0;
    let touchStartY = 0;
    let touchDecided = false;
    let touchSnapping = false;     // this gesture has triggered a snap-back

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      if (isSnappingBack) {
        gsap.killTweensOf(zMesh.rotation);
        isSnappingBack = false;
      }
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchDecided = false;
      touchSnapping = false;
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length !== 1) return;
      if (touchSnapping) { e.preventDefault(); return; }

      const x = e.touches[0].clientX;
      const y = e.touches[0].clientY;
      const dx = x - touchStartX;
      const dy = y - touchStartY;

      if (!touchDecided) {
        if (Math.hypot(dx, dy) < TOUCH_DECIDE_PX) return;
        touchDecided = true;
        if (Math.abs(dx) > Math.abs(dy)) {
          // Horizontal intent → start drag-rotate
          userIsDragging = true;
          dragStartX = touchStartX;
          zRotationStart = zMesh.rotation.y;
        } else if (Math.abs(zMesh.rotation.y) > ROT_EPSILON) {
          // Vertical intent + Z rotated → snap back and consume this gesture
          touchSnapping = true;
          e.preventDefault();
          snapZBackToZero();
          return;
        }
        // else: vertical intent + Z home → let the browser scroll
      }

      if (userIsDragging) {
        e.preventDefault();
        const deltaX = x - dragStartX;
        zMesh.rotation.y = zRotationStart + deltaX * DRAG_SENSITIVITY;
      }
    }, { passive: false });

    const endTouch = () => {
      if (userIsDragging) {
        userIsDragging = false;
        refreshTouchAction();
      }
      touchDecided = false;
      touchSnapping = false;
    };
    canvas.addEventListener('touchend',    endTouch, { passive: true });
    canvas.addEventListener('touchcancel', endTouch, { passive: true });
  }
  </script>
</body>
</html>
