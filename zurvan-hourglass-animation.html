<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZURVAN — Scroll Animation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #F3E9D9;
      color: #231f20;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .hero svg { width: min(70vw, 600px); height: auto; overflow: visible; }
    .hero__particles {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .after {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 4vw, 56px);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .after--dark { background: #231f20; color: #f5f3ef; }
    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.5;
      pointer-events: none;
    }
    .scroll-hint::after {
      content: "";
      display: block;
      width: 1px;
      height: 36px;
      margin: 8px auto 0;
      background: currentColor;
      animation: hint 1.6s ease-in-out infinite;
      transform-origin: top;
    }
    @keyframes hint {
      0%, 100% { transform: scaleY(0.3); opacity: 0.2; }
      50%      { transform: scaleY(1);   opacity: 0.8; }
    }
  </style>
</head>
<body>

          <path id="v" class="cls-1" d="M262.83,147.9V150a9.73,9.73,0,0,0-4.26,2.42q-2.26,2-4.05,6.73l-24.73,63.76h-1.68l-25.67-66.18q-1.58-4-3.58-5.31a7.77,7.77,0,0,0-3.68-1.42v-2.1q2.1.11,5.21.21t6,.11q4.1,0,7.68-.11t5.79-.21V150a16.71,16.71,0,0,0-5.42.84,2.9,2.9,0,0,0-2,2.58,13.57,13.57,0,0,0,1.21,5.42l19.57,51.87-1.68,1.79,18.31-47.56q2.21-5.68,2.1-8.89a5.11,5.11,0,0,0-2.42-4.58,14.12,14.12,0,0,0-6.73-1.47v-2.1l6.21.21q3.16.11,5.89.11t4.52-.11Z"/>
          <path id="a" class="cls-1" d="M289.35,147.37,315,213.55q1.58,4,3.58,5.31a7.71,7.71,0,0,0,3.68,1.42v2.1q-2.11-.21-5.16-.26t-6.1-.05q-4.1,0-7.68.05t-5.79.26v-2.1q5.37-.21,6.84-1.84t-.63-7l-19.57-52.29,1.68-1.37-18.31,47.56a28.12,28.12,0,0,0-2,7.1,7.94,7.94,0,0,0,.58,4.58,5.13,5.13,0,0,0,3.05,2.42,18.82,18.82,0,0,0,5.42.84v2.1q-2.95-.21-6.16-.26t-5.94-.05q-2.63,0-4.47.05a33.57,33.57,0,0,0-3.42.26v-2.1a10.53,10.53,0,0,0,4.31-2.47q2.21-1.95,4-6.68l24.73-63.76h1.68Zm12.84,44.72v2.1H270.83l1.05-2.1Z"/>
          <path id="n" class="cls-1" d="M390,147.9V150a13.06,13.06,0,0,0-5.42,1.05,4.83,4.83,0,0,0-2.47,3.05,22,22,0,0,0-.63,6v62.82H379.1l-44.19-68.29v55.56a20.4,20.4,0,0,0,.68,5.94,4.74,4.74,0,0,0,2.74,3.05,18.56,18.56,0,0,0,6.16,1.1v2.1q-1.89-.21-4.95-.26t-5.79-.05q-2.63,0-5.31.05t-4.47.26v-2.1a14.86,14.86,0,0,0,5.42-1.1,4.66,4.66,0,0,0,2.47-3.05,22.05,22.05,0,0,0,.63-5.94V159a19.09,19.09,0,0,0-.63-5.73,4,4,0,0,0-2.47-2.52A18,18,0,0,0,324,150v-2.1q1.79.11,4.47.21t5.31.11q2.31,0,4.42-.11l3.79-.21,37.14,57.24v-45a20.36,20.36,0,0,0-.68-6,4.91,4.91,0,0,0-2.74-3.05,16.38,16.38,0,0,0-6.16-1.05v-2.1q1.89.11,5,.21t5.73.11q2.73,0,5.42-.11T390,147.9Z"/>

      </g>
    </svg>
    <canvas class="hero__particles" aria-hidden="true"></canvas>
    <span class="scroll-hint">Scroll</span>

  <section class="after">Keep scrolling</section>
  <section class="after after--dark">End</section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <script>
  (() => {
    gsap.registerPlugin(ScrollTrigger);

    const PARTICLE_COUNT = 1000;
    const VIEWBOX_W = 390.04;
    const VIEWBOX_H = 223.86;
    const NECK_VB_X = 195;
    const NECK_VB_Y = 65;
    const FALL_DURATION = 0.25;
    const TWO_PI = Math.PI * 2;
    const FILL_COLOR = "#091F34";

    const letters     = gsap.utils.toArray("#zurvan path");
    const mainIcon    = document.querySelector("#main-z-icon");
    const hourglassEl = document.querySelector("#hourglass-icon");
    const zurvan      = document.querySelector("#zurvan");
    const svg         = document.querySelector(".hero svg");
    const hero        = document.querySelector(".hero");
    const canvas      = document.querySelector(".hero__particles");
    const ctx         = canvas.getContext("2d");

    gsap.set(zurvan, { y: -65, opacity: 1, transformOrigin: "50% 50%" });
    gsap.set("#z",    { transformOrigin: "50% 50%" });

    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    defs.innerHTML = '<filter id="wave-distortion" x="-200%" y="-200%" width="500%" height="500%"><feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.01 0.02" numOctaves="2" seed="2" result="noise"/><feDisplacementMap id="displacement" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter>';
    svg.prepend(defs);
    gsap.set("#zurvan", { filter: "url(#wave-distortion)" });

    function samplePathRegion(pathEl, count, yMin, yMax) {
      const bbox = pathEl.getBBox();
      const point = pathEl.ownerSVGElement.createSVGPoint();
      const yStart = yMin === undefined ? bbox.y : Math.max(bbox.y, yMin);
      const yEnd   = yMax === undefined ? bbox.y + bbox.height : Math.min(bbox.y + bbox.height, yMax);
      const xEnd   = bbox.x + bbox.width;
      const all = [];
      for (let y = yStart; y < yEnd; y += 0.7) {
        for (let x = bbox.x; x < xEnd; x += 0.7) {
          point.x = x; point.y = y;
          if (pathEl.isPointInFill(point)) all.push(x, y);
        }
      }
      const out = new Array(count);
      const half = all.length >> 1;
      for (let i = 0; i < count; i++) {
        const k = ((Math.random() * half) | 0) << 1;
        out[i] = [all[k], all[k + 1]];
      }
      return out;
    }

    const zVB   = samplePathRegion(mainIcon,    PARTICLE_COUNT);
    const topVB = samplePathRegion(hourglassEl, PARTICLE_COUNT, 0, NECK_VB_Y);
    const botVB = samplePathRegion(hourglassEl, PARTICLE_COUNT, NECK_VB_Y, 130);
    topVB.sort((a, b) => b[1] - a[1]);
    botVB.sort((a, b) => b[1] - a[1]);

    const particles = new Array(PARTICLE_COUNT);
    const invCount = 1 / (PARTICLE_COUNT - 1);
    const fallSpan = 1 - FALL_DURATION;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const top = topVB[i], bot = botVB[i], z = zVB[i];
      const scAngle = Math.random() * TWO_PI;
      const scDist  = 300 + Math.random() * 500;
      const size = 1.5 + Math.random() * 2;
      const assembleDelay = Math.random() * 0.25;
      particles[i] = {
        zVbX: z[0],     zVbY: z[1],
        topVbX: top[0], topVbY: top[1],
        botVbX: bot[0], botVbY: bot[1],
        zTx: 0, zTy: 0,
        topTx: 0, topTy: 0,
        botTx: 0, botTy: 0,
        sx: 0, sy: 0,
        scatterX: Math.cos(scAngle) * scDist,
        scatterY: Math.sin(scAngle) * scDist,
        size,
        halfSize: size * 0.5,
        assembleDelay,
        invAssembleDuration: 1 / (1 - assembleDelay),
        pourDelay: i * invCount * fallSpan,
      };
    }

    let canvasW = 0, canvasH = 0;
    let neckX = 0, neckY = 0;

    function updateLayout() {
      const dpr = window.devicePixelRatio || 1;
      const heroRect = hero.getBoundingClientRect();
      const svgRect  = svg.getBoundingClientRect();
      canvasW = heroRect.width;
      canvasH = heroRect.height;
      canvas.width  = canvasW * dpr;
      canvas.height = canvasH * dpr;
      canvas.style.width  = canvasW + "px";
      canvas.style.height = canvasH + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const scale = svgRect.width / VIEWBOX_W;
      const ox = svgRect.left - heroRect.left;
      const oy = svgRect.top  - heroRect.top;
      const cx = ox + (VIEWBOX_W * 0.5) * scale;
      const cy = oy + (VIEWBOX_H * 0.5) * scale;
      const diag = Math.hypot(canvasW, canvasH);

      neckX = ox + NECK_VB_X * scale;
      neckY = oy + NECK_VB_Y * scale;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        p.zTx   = ox + p.zVbX   * scale;
        p.zTy   = oy + p.zVbY   * scale;
        p.topTx = ox + p.topVbX * scale;
        p.topTy = oy + p.topVbY * scale;
        p.botTx = ox + p.botVbX * scale;
        p.botTy = oy + p.botVbY * scale;
        const a = Math.random() * TWO_PI;
        const d = diag * (0.6 + Math.random() * 0.6);
        p.sx = cx + Math.cos(a) * d;
        p.sy = cy + Math.sin(a) * d;
      }
    }
    updateLayout();
    window.addEventListener("resize", () => { updateLayout(); ScrollTrigger.refresh(); });

    const phase = { assemble: 0, morph: 0, pour: 0, scatter: 0 };

    function render() {
      ctx.clearRect(0, 0, canvasW, canvasH);
      ctx.fillStyle = FILL_COLOR;

      const a = phase.assemble;
      const m = phase.morph;
      const pPour = phase.pour;
      const s = phase.scatter;
      const sActive = s > 0;
      const se = sActive ? s * s : 0;
      const sAlpha = 1 - se;
      const invFall = 1 / FALL_DURATION;
      const useAssembly = pPour === 0;

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = particles[i];
        let x, y, alpha;

        if (useAssembly) {
          let pa = (a - p.assembleDelay) * p.invAssembleDuration;
          if (pa < 0) pa = 0; else if (pa > 1) pa = 1;
          const inv = 1 - pa;
          const eased = 1 - inv * inv * inv;
          const destX = p.zTx + (p.topTx - p.zTx) * m;
          const destY = p.zTy + (p.topTy - p.zTy) * m;
          x = p.sx + (destX - p.sx) * eased;
          y = p.sy + (destY - p.sy) * eased;
          alpha = eased;
        } else {
          let pourT = (pPour - p.pourDelay) * invFall;
          if (pourT < 0) pourT = 0; else if (pourT > 1) pourT = 1;
          const t = pourT * pourT;
          const om = 1 - t;
          const omSq = om * om;
          const tSq = t * t;
          const om2t = 2 * om * t;
          x = omSq * p.topTx + om2t * neckX + tSq * p.botTx;
          y = omSq * p.topTy + om2t * neckY + tSq * p.botTy;
          alpha = 1;
        }

        if (sActive) {
          x = p.botTx + p.scatterX * se;
          y = p.botTy + p.scatterY * se;
          alpha = sAlpha;
        }

        if (alpha > 0.01) {
          ctx.globalAlpha = alpha;
          ctx.fillRect(x - p.halfSize, y - p.halfSize, p.size, p.size);
        }
      }
      ctx.globalAlpha = 1;
    }
    gsap.ticker.add(render);

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".hero",
        start: "top top",
        end: "+=4500",
        scrub: 0.6,
        pin: true,
        anticipatePin: 1,
      }
    });

    tl.to("#turbulence",   { attr: { baseFrequency: "0.04 0.07" }, duration: 2, ease: "sine.inOut" })
      .to("#displacement", { attr: { scale: 160 },                 duration: 2, ease: "sine.inOut" }, "<")
      .to("#z", { y: -28, x: -10, skewY:  22, rotation: -14, duration: 2 }, "<")
      .to("#u", { y:  22, x:   8, skewY: -20, rotation:  12, duration: 2 }, "<")
      .to("#r", { y: -30, x:  -6, skewY:  20, rotation: -10, duration: 2 }, "<")
      .to("#v", { y:  28, x:   6, skewY: -24, rotation:  14, duration: 2 }, "<")
      .to("#a", { y: -22, x:  -8, skewY:  18, rotation: -10, duration: 2 }, "<")
      .to("#n", { y:  32, x:  12, skewY: -22, rotation:  16, duration: 2 }, "<");

    tl.to(letters, { opacity: 0, stagger: { each: 0.02, from: "center" }, duration: 0.35, ease: "power2.in" })
      .to("#displacement", { attr: { scale: 0 }, duration: 0.3 }, ">")
      .to(phase, { assemble: 1, duration: 1.5, ease: "power3.out" }, "<+=0.1")
      .to({},    { duration: 0.4 })
      .to(phase, { morph:    1, duration: 1.2, ease: "power2.inOut" })
      .to({},    { duration: 0.4 })
      .to(phase, { pour:     1, duration: 2.4, ease: "none" })
      .to({},    { duration: 0.4 })
      .to(phase, { scatter:  1, duration: 1.4, ease: "power2.in" });

    gsap.to(".scroll-hint", {
      opacity: 0,
      scrollTrigger: { trigger: ".hero", start: "top top", end: "+=200", scrub: true }
    });
  })();
  </script>
</body>
